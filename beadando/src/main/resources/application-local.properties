# ---------------------------------------------------------------
# Helyi fejlesztés: H2 memória-adatbázis MySQL kompatibilis módban.
# Indítás: SPRING_PROFILES_ACTIVE=local  (IntelliJ: "Beadando (local)" futtatási konfiguráció)
# Minden indításkor újra feltölti az NB I. adatokat.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:nb1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# A szerveren az alkalmazás a /neptunkod/ útvonal alatt fut, ezért helyben is
# context path alatt futtatjuk, hogy a rossz (abszolút) linkek már itt kiderüljenek.
server.servlet.context-path=/nb1
server.port=8080

spring.thymeleaf.cache=false

# Helyi admin felhasználó (az AdminSeeder hozza létre induláskor)
app.admin.username=admin
app.admin.password=admin
