spring.application.name=beadando

# Titkos beállítások (pl. app.admin.password) - ez a fájl NINCS a git-ben (.gitignore).
# A szerverre szánt WAR build előtt hozzuk létre: src/main/resources/application-secret.properties
#   app.admin.username=admin
#   app.admin.password=...
spring.config.import=optional:classpath:application-secret.properties

# ---------------------------------------------------------------
# Alapértelmezett (szerver / rivendell) beállítások - MySQL
# A rivendell-en az adatbázis neve, felhasználója és jelszava is a Neptun-kód.
# Helyi fejlesztéshez a "local" profilt használjuk (application-local.properties, H2).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${DB_NAME:neptunkod}
spring.datasource.username=${DB_USER:neptunkod}
spring.datasource.password=${DB_PASSWORD:neptunkod}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Az NB I. adatok (db/nb1.sql) betöltése induláskor.
# A szkript CREATE TABLE IF NOT EXISTS + INSERT IGNORE utasításokat használ,
# így többszöri indításkor sem duplikál.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/nb1.sql
spring.sql.init.encoding=UTF-8

spring.jpa.open-in-view=false
